<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pilha kubelet, CRI, runtime de alto nível, runtime OCI, kernel">
<defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ar"/></marker></defs>
<rect x="20" y="20" width="240" height="46" rx="10" class="n"/><text x="140" y="48" text-anchor="middle" class="t" font-weight="700">kubelet</text>
<path d="M140 66 L140 96" class="l" marker-end="url(#a3)"/><text x="150" y="86" class="s">gRPC · runtime.v1 (CRI)</text>
<rect x="20" y="100" width="240" height="66" rx="10" class="a"/><text x="140" y="126" text-anchor="middle" class="t" font-weight="700">Runtime de alto nível</text><text x="140" y="146" text-anchor="middle" class="s">containerd · CRI-O · delonix-cri</text>
<path d="M140 166 L140 196" class="l" marker-end="url(#a3)"/><text x="150" y="186" class="s">runtime-spec (bundle)</text>
<rect x="20" y="200" width="240" height="46" rx="10" class="g"/><text x="140" y="228" text-anchor="middle" class="t" font-weight="700">Runtime OCI de baixo nível</text>
<path d="M140 246 L140 268" class="l" marker-end="url(#a3)"/>
<rect x="20" y="268" width="240" height="28" rx="8" class="b"/><text x="140" y="287" text-anchor="middle" class="s">kernel: namespaces · cgroups · caps</text>
<rect x="320" y="20" width="420" height="276" rx="12" class="b"/><text x="530" y="46" text-anchor="middle" class="t" font-weight="700">O que o CRI acrescenta ao OCI</text>
<text x="345" y="80" class="t">• Pods: RunPodSandbox (rede partilhada)</text><text x="345" y="106" class="t">• Imagens: PullImage · ListImages · ImageStatus</text><text x="345" y="132" class="t">• Streaming: Exec · Attach · PortForward</text><text x="345" y="158" class="t">• Estado: ContainerStatus · ContainerStats</text><text x="345" y="184" class="t">• Configuração: cgroup driver, resources</text>
<text x="345" y="226" class="s">O delonix é os DOIS níveis num só binário,</text><text x="345" y="244" class="s">sem daemon central: cria os containers com o</text><text x="345" y="262" class="s">próprio motor, não delega num runc.</text>
</svg>
