<svg viewBox="0 0 780 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Da imagem OCI ao container em execução">
<defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ar"/></marker></defs>
<text x="95" y="20" text-anchor="middle" class="s">image-spec</text><text x="390" y="20" text-anchor="middle" class="s">runtime-spec</text>
<rect x="10" y="30" width="170" height="170" rx="12" class="n"/><text x="95" y="54" text-anchor="middle" class="t" font-weight="700">Imagem (layout)</text>
<text x="95" y="82" text-anchor="middle" class="s">index.json</text><text x="95" y="102" text-anchor="middle" class="s">↓ manifest</text><text x="95" y="122" text-anchor="middle" class="s">↓ config + layers</text><text x="95" y="146" text-anchor="middle" class="s">blobs/sha256/&lt;hash&gt;</text><text x="95" y="170" text-anchor="middle" class="s">endereçada por conteúdo</text>
<path d="M180 115 L235 115" class="l" marker-end="url(#a2)"/><text x="207" y="104" text-anchor="middle" class="s">unpack</text>
