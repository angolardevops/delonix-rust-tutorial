<!doctype html>
<html lang="pt-AO" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e8590c'/%3E%3Cpath d='M9 9h8a5 5 0 0 1 0 10h-3v4H9zm5 4v2h3a1 1 0 0 0 0-2z' fill='%23fff'/%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem('dxr-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="{{BODYCLASS}}">
<a class="skip" href="#main">Saltar para o conteúdo</a>
<header class="topbar">
  <button class="icon-btn menu-btn" aria-label="Abrir menu" aria-controls="sidebar">☰</button>
  <a class="brand" href="index.html"><span class="logo">R</span><span>delonix<b>-rust</b> <em>tutorial</em></span></a>
  <button class="search-btn" id="search-open" aria-label="Pesquisar (Ctrl+K)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span class="s-label">Pesquisar na documentação…</span><kbd id="kbd-hint">Ctrl K</kbd>
  </button>
  <a class="icon-btn" href="{{REPO}}" aria-label="GitHub" target="_blank" rel="noopener">
    <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></a>
  <button class="icon-btn" id="theme-btn" aria-label="Alternar tema">◐</button>
</header>
<div class="progress" id="progress"></div>
<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="Capítulos">{{NAV}}</nav>
  <main id="main" class="content">
    {{META}}
    <article class="prose">{{BODY}}</article>
    <div class="pager">{{PREVNEXT}}</div>
    <footer class="foot">
      <a href="{{EDIT}}" target="_blank" rel="noopener">Sugerir uma correcção nesta página ↗</a>
      <span>Apache-2.0 · código do tutorial testado em CI · excertos do <a href="https://github.com/angolardevops/delonix-runtime" target="_blank" rel="noopener">delonix-runtime</a></span>
    </footer>
  </main>
  <aside class="toc" aria-label="Nesta página"><h5>Nesta página</h5>{{TOC}}</aside>
</div>
<div class="scrim" id="scrim"></div>

<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Pesquisa" hidden>
  <div class="pal-box">
    <div class="pal-input">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="pal-q" type="text" placeholder="Pesquisar capítulos, código, conceitos…  (ex.: pivot_root, cgroup, digest)" autocomplete="off" spellcheck="false" aria-controls="pal-list">
      <kbd>Esc</kbd>
    </div>
    <ul id="pal-list" role="listbox"></ul>
    <div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> navegar</span><span><kbd>↵</kbd> abrir</span><span><kbd>Esc</kbd> fechar</span><span id="pal-count"></span></div>
  </div>
</div>
<script src="assets/highlight.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
